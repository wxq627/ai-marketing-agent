<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 全链路智能营销决策系统</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <p class="eyebrow">策略运营工作台</p>
        <h1>AI 全链路智能营销决策系统</h1>
      </div>
      <div class="topbar-actions">
        <span id="publishedStatus" class="publish-status">未发布</span>
        <button id="publishBtn" class="secondary-button" type="button" disabled>发布给 C 端</button>
        <button id="generateBtn" class="primary-button" type="button">生成策略</button>
      </div>
    </header>

    <main class="layout">
      <aside class="workspace" aria-label="运营输入">
        <div class="workspace-head">
          <span class="workspace-index">01</span>
          <div><h2>运营意图</h2><span id="statusText">输入目标后由 AI 提取策略参数</span></div>
        </div>

        <label class="goal-label">
          运营目标
          <textarea id="goalInput" rows="6" placeholder="例如：面向高价值、近期有分期意图的客户，使用短信投放分期优惠，预算 20 万。"></textarea>
        </label>
        <button id="parseGoalBtn" class="outline-button" type="button" onclick="window.parseGoalFromUi?.()">解析运营意图</button>

        <section class="ai-suggestion" aria-label="AI 解析建议">
          <div class="suggestion-head"><h2>AI 解析建议</h2><span id="parseSource">待解析</span></div>
          <p id="parseSummary">AI 会提取预算、活动、目标客群、渠道和风险约束，等待运营确认。</p>
          <div id="parsedTags" class="parsed-tags"></div>
          <div class="proposal-actions">
            <button id="acceptSuggestionBtn" class="small-primary" type="button" disabled>确认并填入</button>
            <button id="manualModeBtn" class="small-secondary" type="button">自行填写</button>
          </div>
        </section>

        <div class="form-grid">
          <label>
            活动
            <select id="campaignInput" data-config-control disabled>
              <option value="CAMP_2026_DOUBLE11">双十一分期免息大促</option>
              <option value="CAMP_2026_618">618 购物节返现</option>
              <option value="CAMP_2026_SUMMER">暑期出行季</option>
            </select>
          </label>
          <label>
            预算上限（万元）
            <input id="budgetInput" data-config-control type="number" min="1" max="200" value="80" disabled>
          </label>
          <label>
            目标客群
            <select id="targetSegmentInput" data-config-control disabled>
              <option value="auto">自动圈选</option>
              <option value="high_value">高价值客户</option>
              <option value="high_intent">高意图客户</option>
              <option value="dormant">沉睡待唤醒客户</option>
              <option value="young_new">年轻或新户客户</option>
            </select>
          </label>
          <label>
            投放渠道偏好
            <select id="channelModeInput" data-config-control disabled>
              <option value="omni">智能全渠道</option>
              <option value="app">仅 App Push</option>
              <option value="sms">仅短信</option>
              <option value="wechat">仅微信公众号</option>
            </select>
          </label>
        </div>
      </aside>

      <section class="dashboard" aria-label="策略结果">
        <section class="metric-band" aria-label="核心指标">
          <article class="metric-card metric-audience"><span>推荐客群</span><strong id="audienceMetric">-</strong></article>
          <article class="metric-card metric-conversion"><span>预计转化率</span><strong id="upliftMetric">-</strong></article>
          <article class="metric-card metric-value"><span>预计净价值</span><strong id="roiMetric">-</strong></article>
          <article class="metric-card metric-budget"><span>预算使用率</span><strong id="riskMetric">-</strong></article>
        </section>

        <section class="decision-band" aria-label="AI 决策链路">
          <div class="section-head"><h2>AI 决策链路</h2><span id="campaignId">尚未生成</span></div>
          <div class="pipeline">
            <div class="stage stage-compliance"><b>合规</b><span>授权 / 频控 / 容量</span></div>
            <div class="stage stage-predict"><b>预测</b><span>打开 / 点击 / 转化 / 退订</span></div>
            <div class="stage stage-value"><b>价值</b><span>收益 / LTV / 成本 / 风险</span></div>
            <div class="stage stage-select"><b>优选</b><span>预算 / 去重 / 渠道</span></div>
          </div>
        </section>

        <section class="strategy-focus" aria-label="策略生成结果">
          <div class="section-head"><h2>策略生成结果</h2><span id="optimizationStatus">等待生成</span></div>
          <div id="optimizationSummary" class="optimization-summary">请先确认运营输入，再基于预算进行候选筛选。</div>
          <div id="selectedCandidates" class="list"></div>
        </section>

        <div class="two-column">
          <section class="result-panel audience-panel"><h2>推荐客群</h2><div id="segments" class="list"></div></section>
          <section class="result-panel channel-panel"><h2>投放渠道</h2><div id="channels" class="list"></div></section>
        </div>

        <section class="result-panel content-panel"><h2>内容生成</h2><div id="contentBox" class="content-box"></div></section>

        <div class="two-column">
          <section class="result-panel compliance-panel"><h2>合规校验</h2><div id="compliance" class="list"></div></section>
          <section class="result-panel forecast-panel"><h2>效果预测</h2><svg id="forecastChart" viewBox="0 0 520 220" role="img" aria-label="效果预测柱状图"></svg></section>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
