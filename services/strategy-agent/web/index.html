<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 全链路智能营销决策系统</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">信用卡算法类课题 MVP</p>
        <h1>AI 全链路智能营销决策系统</h1>
      </div>
      <div class="topbar-actions">
        <span id="publishedStatus" class="publish-status">未发布</span>
        <button id="publishBtn" class="secondary-button" type="button" disabled>发布给 C 端</button>
        <button id="generateBtn" class="primary-button" type="button">生成策略</button>
      </div>
    </header>

    <main class="layout">
      <section class="workspace" aria-label="营销配置">
        <div class="section-head">
          <h2>运营输入</h2>
          <span id="statusText">等待生成</span>
        </div>
        <label>
          活动目标
          <textarea id="goalInput">基于历史活动响应、客户行为与合规约束，生成具有正向预期净价值的投放策略。</textarea>
        </label>
        <div class="form-grid">
          <label>
            历史活动
            <select id="campaignInput">
              <option value="CAMP_2026_DOUBLE11">分期促活活动</option>
              <option value="CAMP_2026_618">消费权益活动</option>
              <option value="CAMP_2026_SUMMER">出行权益活动</option>
            </select>
          </label>
          <label>
            产品
            <select id="productInput" disabled>
              <option value="installment">由活动策略映射</option>
            </select>
          </label>
          <label>
            渠道
            <select id="channelInput" disabled>
              <option value="omni">由客户授权与渠道容量决定</option>
            </select>
          </label>
          <label>
            预算上限（万元）
            <input id="budgetInput" type="number" min="30" max="160" value="80">
          </label>
          <label>
            风险容忍
            <select id="riskInput" disabled>
              <option value="2">策略规则控制</option>
            </select>
          </label>
          <label>
            频控强度
            <select id="freqInput" disabled>
              <option value="2">客户级频控规则</option>
            </select>
          </label>
        </div>
      </section>

      <section class="dashboard" aria-label="方案结果">
        <div class="metrics">
          <article><span>推荐客群</span><strong id="audienceMetric">-</strong></article>
          <article><span>预计转化率</span><strong id="upliftMetric">-</strong></article>
          <article><span>预计净价值</span><strong id="roiMetric">-</strong></article>
          <article><span>预算使用率</span><strong id="riskMetric">-</strong></article>
        </div>

        <div class="section-head">
          <h2>AI 决策链路</h2>
          <span id="campaignId">尚未生成</span>
        </div>
        <div class="pipeline" aria-label="AI 决策链路">
          <div><b>合规</b><span>授权/频控/容量</span></div>
          <div><b>预测</b><span>打开/点击/转化/退订</span></div>
          <div><b>价值</b><span>收益/LTV/成本/风险</span></div>
          <div><b>优选</b><span>预算/去重/渠道</span></div>
        </div>

        <section aria-label="策略生成结果">
          <div class="section-head">
            <h2>策略生成结果</h2>
            <span id="optimizationStatus">等待生成</span>
          </div>
          <div id="optimizationSummary" class="optimization-summary">尚未基于预算进行候选筛选。</div>
          <div id="selectedCandidates" class="list"></div>
        </section>

        <div class="two-column">
          <section><h2>推荐客群</h2><div id="segments" class="list"></div></section>
          <section><h2>投放策略</h2><div id="channels" class="list"></div></section>
        </div>

        <section><h2>内容生成</h2><div id="contentBox" class="content-box"></div></section>

        <div class="two-column">
          <section><h2>合规校验</h2><div id="compliance" class="list"></div></section>
          <section><h2>效果预测</h2><svg id="forecastChart" viewBox="0 0 520 220" role="img" aria-label="效果预测柱状图"></svg></section>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
