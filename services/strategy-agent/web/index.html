<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI全链路智能营销决策系统</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">招商银行信用卡 · 算法类课题 MVP</p>
        <h1>AI全链路智能营销决策系统</h1>
      </div>
      <button id="generateBtn" class="primary-button" type="button">生成营销方案</button>
    </header>

    <main class="layout">
      <section class="workspace" aria-label="营销配置">
        <div class="section-head">
          <h2>运营输入</h2>
          <span id="statusText">等待生成</span>
        </div>
        <label>
          活动目标
          <textarea id="goalInput">面向近期有餐饮、商旅、线上支付活跃行为的客户，提升信用卡分期与消费券活动转化，同时控制打扰频次和合规风险。</textarea>
        </label>
        <div class="form-grid">
          <label>
            产品
            <select id="productInput">
              <option value="installment">信用卡分期</option>
              <option value="coupon">消费券包</option>
              <option value="travel">商旅权益</option>
            </select>
          </label>
          <label>
            渠道
            <select id="channelInput">
              <option value="omni">App + 短信 + 企微</option>
              <option value="app">App 主阵地</option>
              <option value="sms">短信召回</option>
            </select>
          </label>
          <label>
            预算上限
            <input id="budgetInput" type="number" min="30" max="160" value="80">
          </label>
          <label>
            风险容忍
            <select id="riskInput">
              <option value="1">低</option>
              <option value="2" selected>中</option>
              <option value="3">高</option>
            </select>
          </label>
          <label>
            频控强度
            <select id="freqInput">
              <option value="1">7天1次</option>
              <option value="2" selected>7天2次</option>
              <option value="3">7天3次</option>
              <option value="4">3天2次</option>
            </select>
          </label>
        </div>
      </section>

      <section class="dashboard" aria-label="方案结果">
        <div class="metrics">
          <article>
            <span>推荐客群</span>
            <strong id="audienceMetric">-</strong>
          </article>
          <article>
            <span>预测提升</span>
            <strong id="upliftMetric">-</strong>
          </article>
          <article>
            <span>预测 ROI</span>
            <strong id="roiMetric">-</strong>
          </article>
          <article>
            <span>投诉风险</span>
            <strong id="riskMetric">-</strong>
          </article>
        </div>

        <div class="section-head">
          <h2>AI决策链路</h2>
          <span id="campaignId">尚未生成</span>
        </div>
        <div class="pipeline" aria-label="AI链路">
          <div><b>理解</b><span>目标/产品/约束</span></div>
          <div><b>预测</b><span>响应/转化/风险</span></div>
          <div><b>决策</b><span>客群/预算/渠道</span></div>
          <div><b>生成</b><span>内容/实验/复盘</span></div>
        </div>

        <div class="two-column">
          <section>
            <h2>推荐客群</h2>
            <div id="segments" class="list"></div>
          </section>
          <section>
            <h2>投放策略</h2>
            <div id="channels" class="list"></div>
          </section>
        </div>

        <section>
          <h2>内容生成</h2>
          <div id="contentBox" class="content-box"></div>
        </section>

        <div class="two-column">
          <section>
            <h2>合规校验</h2>
            <div id="compliance" class="list"></div>
          </section>
          <section>
            <h2>效果预测</h2>
            <svg id="forecastChart" viewBox="0 0 520 220" role="img" aria-label="效果预测柱状图"></svg>
          </section>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
