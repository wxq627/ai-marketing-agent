<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 全链路智能营销决策系统</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">信用卡算法类课题 MVP</p>
        <h1>AI 全链路智能营销决策系统</h1>
      </div>
      <div class="topbar-actions">
        <span id="publishedStatus" class="publish-status">未发布</span>
        <button id="publishBtn" class="secondary-button" type="button" disabled>发布给 C 端</button>
        <button id="generateBtn" class="primary-button" type="button">生成策略</button>
      </div>
    </header>

    <main class="layout">
      <section class="workspace" aria-label="运营输入">
        <div class="section-head">
          <h2>运营输入</h2>
          <span id="statusText">等待生成</span>
        </div>
        <div class="form-grid">
          <label>
            历史活动
            <select id="campaignInput">
              <option value="CAMP_2026_DOUBLE11">分期促活活动</option>
              <option value="CAMP_2026_618">消费权益活动</option>
              <option value="CAMP_2026_SUMMER">出行权益活动</option>
            </select>
          </label>
          <label>
            预算上限（万元）
            <input id="budgetInput" type="number" min="30" max="160" value="80">
          </label>
        </div>
      </section>

      <section class="dashboard" aria-label="策略生成结果">
        <section>
          <div class="section-head">
            <h2>策略生成结果</h2>
            <span id="optimizationStatus">等待生成</span>
          </div>
          <div id="optimizationSummary" class="optimization-summary">请选择活动和预算后生成策略。</div>
          <div id="selectedCandidates" class="list"></div>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
